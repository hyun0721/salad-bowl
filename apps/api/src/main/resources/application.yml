spring:
  application:
    name: salad-bowl-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saladbowl}
    username: ${DB_USERNAME:saladbowl}
    password: ${DB_PASSWORD:saladbowl}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # 한 번에 최대 3개월치(실제 약 65KB). XSSF 파싱 메모리(약 170MB/MB)를 512MB 인스턴스 안에 묶는다.
      max-file-size: 512KB
      max-request-size: 1MB

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me}
    access-ttl: PT15M
    refresh-ttl: P14D
  auth:
    # 구글 OAuth 클라이언트 ID. 비어 있으면 구글 로그인은 꺼진다.
    google-client-id: ${GOOGLE_CLIENT_ID:}
    refresh-cookie:
      path: ${REFRESH_COOKIE_PATH:/api/auth}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    bcrypt-strength: 10

management:
  endpoints:
    web:
      exposure:
        include: health

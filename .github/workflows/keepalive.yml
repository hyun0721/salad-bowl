# 5분마다 주 깨우기는 keepalive Worker가 맡는다(https://github.com/hyun0721/salad-bowl/issues/92).
# 이 예약 워크플로는 실행 간격이 불규칙한 보조 확인으로 Pages 경로 health와 Supabase 활동을 점검한다.
# 저장소 변수(Repository variable) API_HEALTH_URL = https://<Pages 주소>/api/actuator/health (비밀값 아님).
# Environment 보호 규칙(승인 대기 등)에 막히지 않도록 environment를 쓰지 않는다.
# 공개 저장소는 60일 동안 활동이 없으면 예약 워크플로가 꺼진다 — docs/deploy.md의 재활성화 절차를 본다.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Call API health through Pages
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        # 200 HTML(SPA로 빗나간 응답)을 성공으로 보지 않도록 본문의 status까지 확인한다.
        run: |
          if [ -z "$URL" ]; then echo "::warning::API_HEALTH_URL repository variable is not set; nothing was pinged"; exit 0; fi
          body=$(curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$URL")
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'

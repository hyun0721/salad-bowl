name: test-data-ci

on:
  push:
    branches: [main]
    paths: ["scripts/test_data.py", "scripts/test_test_data.py", ".github/workflows/test-data-ci.yml"]
  pull_request:
    paths: ["scripts/test_data.py", "scripts/test_test_data.py", ".github/workflows/test-data-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m unittest discover -s scripts -v

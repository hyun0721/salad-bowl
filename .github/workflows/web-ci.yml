name: web-ci

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "scripts/release/**", "release-version.json", "render.yaml", ".dockerignore", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", "scripts/release/**", "release-version.json", "render.yaml", ".dockerignore", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release numbering and source metadata
        working-directory: .
        env:
          RELEASE_MODE: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
          python3 scripts/release/version.py --mode "$RELEASE_MODE" --commit "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

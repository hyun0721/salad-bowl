# GitHub Environment `production`(Secrets·Variables)을 배포 플랫폼에 넣는다. 플랫폼을 바꾸면 아래 두 단계만 바꾼다.
# 수동 실행: Actions → sync-config → Run workflow. dry_run이면 값과 최소 길이를 확인하고 API를 부르지 않는다.
name: sync-config

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "값이 모두 있는지만 확인한다(API 호출 없음)"
        type: boolean
        default: false
      deploy:
        description: "Render 재배포까지 요청한다"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-config
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PROXY_SECRET: ${{ secrets.PROXY_SECRET }}
      API_ORIGIN: ${{ vars.API_ORIGIN }}
    steps:
      - name: Check that every value is set
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_SERVICE_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT \
                      DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET PROXY_SECRET API_ORIGIN; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set in environment 'production'"; missing=1; fi
          done
          if [ "${#JWT_SECRET}" -lt 32 ]; then echo "::error::JWT_SECRET must be at least 32 characters"; missing=1; fi
          if [ "${#PROXY_SECRET}" -lt 32 ]; then echo "::error::PROXY_SECRET must be at least 32 characters"; missing=1; fi
          case "$API_ORIGIN" in https://*) ;; *) echo "::error::API_ORIGIN must start with https://"; missing=1 ;; esac
          case "$DB_URL" in
            jdbc:postgresql://*sslmode=require*) ;;
            *) echo "::error::DB_URL must be jdbc:postgresql://…?sslmode=require"; missing=1 ;;
          esac
          exit $missing

      - name: Render environment variables
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          put() {
            local key=$1
            jq -n --arg k "$key" '{value: env[$k]}' > "$RUNNER_TEMP/body.json"
            code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -X PUT \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
              --data @"$RUNNER_TEMP/body.json")
            rm -f "$RUNNER_TEMP/body.json"
            if [ "$code" -ge 300 ]; then echo "::error::Render $key -> HTTP $code"; exit 1; fi
            echo "Render: $key updated"
          }
          for key in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET PROXY_SECRET; do put "$key"; done

      - name: Cloudflare Pages environment variables
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          jq -n --arg origin "$API_ORIGIN" --arg secret "$PROXY_SECRET" '
            {API_ORIGIN: {type: "plain_text", value: $origin},
             PROXY_SECRET: {type: "secret_text", value: $secret},
             NODE_VERSION: {type: "plain_text", value: "22"}} as $vars
            | {deployment_configs: {production: {env_vars: $vars}, preview: {env_vars: $vars}}}' > "$RUNNER_TEMP/pages.json"
          code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/pages.json")
          rm -f "$RUNNER_TEMP/pages.json"
          if [ "$code" -ge 300 ]; then echo "::error::Cloudflare Pages -> HTTP $code"; exit 1; fi
          echo "Cloudflare Pages: API_ORIGIN, PROXY_SECRET, NODE_VERSION updated (applies to the next Pages deployment)"

      - name: Trigger Render deploy
        if: ${{ !inputs.dry_run && inputs.deploy }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Content-Type: application/json' \
            --data '{"clearCache":"do_not_clear"}')
          if [ "$code" -ge 300 ]; then echo "::error::Render deploy -> HTTP $code"; exit 1; fi
          echo "Render: deploy requested"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### sync-config"
            echo "- dry_run: ${{ inputs.dry_run }}, deploy: ${{ inputs.deploy }}"
            echo "- Pages 환경변수는 다음 Pages 배포부터 적용된다. Pages 최신 배포를 Retry 한 뒤 API를 배포한다."
          } >> "$GITHUB_STEP_SUMMARY"

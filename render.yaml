# Render Blueprint. 대시보드에서 "New → Blueprint"로 이 저장소를 연결하면 이 서비스가 만들어진다.
# 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET)는 여기 두지 않는다. 원본은 GitHub Environment
# `production`이고, 수동 실행 워크플로 sync-config가 Render API로 넣는다(docs/deploy.md). 그 전의 첫 배포는 실패한다.
services:
  - type: web
    name: salad-bowl-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    # GitHub 검사(api-ci)가 통과한 커밋만 배포한다.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - scripts/release/**
        - release-version.json
        - render.yaml
        - .dockerignore
